services:
  node:
    image: node:24-alpine
    command: sh -c "apk add --no-cache git && git config --global --add safe.directory /app && npm install && npx vitepress dev docs --host 0.0.0.0"
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules

volumes:
  node_modules:
